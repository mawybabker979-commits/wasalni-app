<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تطبيق وصلني - تسجيل الدخول</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header>
        <h2><a href="index.html" style="text-decoration: none; color: inherit;">تطبيق وصلني 🚗</a></h2>
        <nav>
            <a href="map.html">الخريطة</a> | 
            <a href="about.html">عن الموقع</a> | 
            <a href="contact.html">تواصل معنا</a>
        </nav>
    </header>

    <h2 id="welcome-msg" style="color: #2c3e50; font-size: 20px; text-align: center; margin: 15px 0;">مرحباً بك في تطبيق وصلني</h2>

    <hr>

    <main>
        <h3>تسجيل الدخول إلى حسابك</h3>
        <form action="map.html" method="get">
            <div>
                <label for="username">رقم الهاتف أو البريد:</label><br>
                <input type="text" id="username" name="username" required placeholder="أدخل معلومات الدخول">
            </div>
            <br>
            <div>
                <label for="password">كلمة المرور:</label><br>
                <input type="password" id="password" name="password" required placeholder="أدخل كلمة المرور">
            </div>
            <br>
            <div>
                <button type="submit" id="login-btn">تسجيل الدخول</button>
            </div>
        </form>
    </main>

    <hr>

    <footer>
        <p>&copy; 2026 تطبيق وصلني - جميع الحقوق محفوظة</p>
    </footer>
